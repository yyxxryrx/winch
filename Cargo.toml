[package]
name = "winch"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
env_logger = "0.11.11"
hex = "0.4.3"
json = "0.12.4"
log = "0.4.34"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
